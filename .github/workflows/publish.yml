name: "Build and Publish Base Images"
on:
  workflow_dispatch:
  # Every 3 months, on day 1 of the starting month
  schedule:
    - cron:  '0 0 1 */3 *'

permissions:
  id-token: write
  contents: read
  packages: write

env:
  REPOSITORY: "lancemccarthy/skia-aspnet"

jobs:
  publish_images:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - version: "6.0"
            context: "BuildContexts/aspnet60"
          - version: "7.0"
            context: "BuildContexts/aspnet70"
          - version: "8.0"
            context: "BuildContexts/aspnet80"
          - version: "9.0"
            context: "BuildContexts/aspnet90"
          - version: "10.0"
            context: "BuildContexts/aspnet100"
    steps:
    - name: Checkout
      uses: actions/checkout@v7
      with:
        fetch-depth: 0

    - name: Set up QEMU
      uses: docker/setup-qemu-action@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4
      
    - name: Get package metadata from Docker Hub
      id: meta
      uses: docker/metadata-action@v6
      with:
        images: ${{env.REPOSITORY}}

    - name: Login to DockerHub
      uses: docker/login-action@v4
      with:
        username: ${{secrets.DOCKER_HUB_USERNAME}}
        password: ${{secrets.DOCKER_HUB_PAT}}

    - name: Login to GitHub Container Registry
      uses: docker/login-action@v4
      with:
        registry: ghcr.io
        username: ${{ github.repository_owner }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Build and publish v${{ matrix.version }}
      uses: docker/build-push-action@v7
      with:
        context: ${{ matrix.context }}
        platforms: linux/arm64,linux/amd64
        push: true
        tags: |
          ${{env.REPOSITORY}}:${{ matrix.version }}
          ghcr.io/${{env.REPOSITORY}}:${{ matrix.version }}